name: Windows CI (portable package on demand)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: Build and test Windows x64
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CMAKE_GENERATOR: Visual Studio 17 2022
      CMAKE_GENERATOR_PLATFORM: x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Release and run automated tests
        shell: powershell
        run: .\scripts\build.ps1

      - name: Create standalone Windows package (manual release only)
        if: github.event_name == 'workflow_dispatch'
        shell: powershell
        run: .\scripts\package.ps1 -SkipBuild

      - name: Verify extracted ZIP, launcher and checksums
        if: github.event_name == 'workflow_dispatch'
        shell: powershell
        run: .\scripts\check-package.ps1 -SmokeLaunch

      - name: Upload portable ZIP and checksum
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: The-Cuelist-Windows-x64-portable
          path: |
            dist/The-Cuelist-*-Windows-x64.zip
            dist/The-Cuelist-*-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
