name: Build Windows portable

on:
  push:
    branches:
      - feat/desktop-foundation
  pull_request:
    branches:
      - feat/desktop-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: Windows x64 portable ZIP
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CMAKE_GENERATOR: Visual Studio 17 2022
      CMAKE_GENERATOR_PLATFORM: x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Release and run automated tests
        shell: powershell
        run: .\scripts\build.ps1

      - name: Create standalone Windows package
        shell: powershell
        run: .\scripts\package.ps1 -SkipBuild

      - name: Verify extracted ZIP and offline launch
        shell: powershell
        run: .\scripts\check-package.ps1 -SmokeLaunch

      - name: Upload portable ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: The-Cuelist-0.5.0-Windows-x64-portable
          path: |
            dist/The-Cuelist-0.5.0-Windows-x64.zip
            dist/The-Cuelist-0.5.0-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
