name: Version and changelog guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versioning:
    name: Validate VERSION.txt and CHANGELOG.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test SemVer/changelog validator
        run: python3 scripts/test_versioning.py
      - name: Check standalone UI V2 concept (no operational runtime)
        run: python3 scripts/test_operator_workspace_v2.py
      - name: Enforce release-note update and monotonic version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ] &&
             [ "${BASE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            python3 scripts/check_versioning.py --base-sha "${BASE_SHA}" --head-sha "${HEAD_SHA}"
          else
            python3 scripts/check_versioning.py
          fi
