name: Windows Release and tests (no portable package)

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Compile application and run CTest
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CMAKE_GENERATOR: Visual Studio 17 2022
      CMAKE_GENERATOR_PLATFORM: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version and changelog before CMake build
        shell: powershell
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/test_versioning.py
          python scripts/test_native_operator_menu_parity.py
          if ($env:BASE_SHA -and $env:HEAD_SHA) {
            python scripts/check_versioning.py --base-sha $env:BASE_SHA --head-sha $env:HEAD_SHA
          } else {
            python scripts/check_versioning.py
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Windows Release and all tests
        shell: powershell
        run: .\scripts\build.ps1
